<svg viewBox="0 0 760 360" role="img" aria-label="ARIES recovery: analysis, redo and undo passes over the write-ahead log" font-size="13"><defs><marker id="ar1112" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Crash recovery is three passes over the log</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">ARIES: find what was in flight, repeat history, then roll back the losers.</text><rect x="40" y="96" width="640" height="30" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="40" y="84" font-size="11" fill="var(--cds-text-secondary)">older LSNs</text><text x="680" y="84" font-size="11" fill="var(--cds-text-secondary)" text-anchor="end">end of durable log</text><line x1="110" y1="90" x2="110" y2="132" stroke="var(--cds-chart-categorical-4)" stroke-width="2.5"></line><text x="110" y="148" font-size="11" text-anchor="middle" fill="var(--cds-text-primary)">T2 begins</text><text x="110" y="162" font-size="11" text-anchor="middle" fill="var(--cds-text-secondary)">(loser)</text><line x1="200" y1="90" x2="200" y2="132" stroke="var(--cds-chart-categorical-3)" stroke-width="2.5"></line><text x="200" y="148" font-size="11" text-anchor="middle" fill="var(--cds-text-primary)">oldest recLSN</text><text x="200" y="162" font-size="11" text-anchor="middle" fill="var(--cds-text-secondary)">(dirty page)</text><line x1="330" y1="90" x2="330" y2="132" stroke="var(--cds-chart-categorical-2)" stroke-width="2.5"></line><text x="330" y="148" font-size="11" text-anchor="middle" fill="var(--cds-text-primary)">checkpoint</text><text x="330" y="162" font-size="11" text-anchor="middle" fill="var(--cds-text-secondary)">(fuzzy)</text><line x1="500" y1="90" x2="500" y2="132" stroke="var(--cds-chart-categorical-5)" stroke-width="2.5"></line><text x="500" y="148" font-size="11" text-anchor="middle" fill="var(--cds-text-primary)">T1 commits</text><text x="500" y="162" font-size="11" text-anchor="middle" fill="var(--cds-text-secondary)">(winner)</text><text x="712" y="116" font-size="12.5" font-weight="600" fill="var(--cds-text-primary)" text-anchor="middle">crash</text><line x1="330" y1="200" x2="676" y2="200" stroke="var(--cds-chart-categorical-2)" stroke-width="2.5" marker-end="url(#ar1112)"></line><text x="24" y="204" font-size="12.5" font-weight="600" fill="var(--cds-text-primary)">1 Analysis</text><text x="330" y="220" font-size="11" fill="var(--cds-text-secondary)">rebuild dirty page table + active txn table</text><line x1="200" y1="250" x2="676" y2="250" stroke="var(--cds-chart-categorical-3)" stroke-width="2.5" marker-end="url(#ar1112)"></line><text x="24" y="254" font-size="12.5" font-weight="600" fill="var(--cds-text-primary)">2 Redo</text><text x="200" y="270" font-size="11" fill="var(--cds-text-secondary)">reapply every change if pageLSN is older</text><line x1="676" y1="300" x2="110" y2="300" stroke="var(--cds-chart-categorical-4)" stroke-width="2.5" marker-end="url(#ar1112)"></line><text x="24" y="304" font-size="12.5" font-weight="600" fill="var(--cds-text-primary)">3 Undo</text><text x="110" y="320" font-size="11" fill="var(--cds-text-secondary)">roll back losers, writing CLRs as it goes</text><text x="24" y="348" font-size="11.5" fill="var(--cds-text-secondary)">Postgres runs only redo; MVCC makes uncommitted tuples invisible, so no undo pass is needed.</text></svg>