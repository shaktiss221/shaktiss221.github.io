<svg viewBox="0 0 760 300" role="img" aria-label="A message lease: receive, then delete, or time out and retry, then dead-letter" font-size="13"><defs><marker id="qa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A received message is leased, not removed</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">The worker must delete it before the lease (visibility timeout) runs out.</text><rect x="40" y="110" width="150" height="46" rx="9" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.4"></rect><text x="115.0" y="138.0" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Visible</text><rect x="300" y="110" width="160" height="46" rx="9" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.4"></rect><text x="380.0" y="138.0" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">In flight (leased)</text><rect x="580" y="110" width="140" height="46" rx="9" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.4"></rect><text x="650.0" y="138.0" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Deleted (done)</text><rect x="300" y="220" width="160" height="46" rx="9" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.4"></rect><text x="380.0" y="248.0" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Dead-letter queue</text><path d="M190,125 L298,125" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#qa)"></path><text x="244" y="117" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">receive</text><path d="M460,133 L578,133" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#qa)"></path><text x="519" y="125" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">delete</text><path d="M300,145 L192,145" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#qa)"></path><text x="246" y="170" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">lease expires</text><text x="246" y="184" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">(crash or too slow)</text><path d="M380,156 L380,218" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#qa)"></path><text x="390" y="196" text-anchor="start" font-size="11.5" fill="var(--cds-text-secondary)">received too many times</text></svg>