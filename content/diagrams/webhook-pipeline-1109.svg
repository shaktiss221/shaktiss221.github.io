<svg viewBox="0 0 760 300" role="img" aria-label="Webhook delivery pipeline from event to receiver" font-size="13"><defs><marker id="wh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A webhook is a distributed system with two owners</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Sender (left of the dashed line) and receiver (right) each need durability and retries.</text><rect x="24" y="90" width="110" height="44" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="79.0" y="117.0" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">DB + outbox</text><rect x="164" y="90" width="100" height="44" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="214.0" y="117.0" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">queue</text><rect x="294" y="90" width="120" height="44" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="354.0" y="117.0" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">dispatcher</text><rect x="470" y="90" width="120" height="44" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="530.0" y="117.0" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">endpoint</text><rect x="620" y="90" width="120" height="44" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="680.0" y="117.0" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">local queue</text><line x1="134" y1="112" x2="162" y2="112" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wh)"></line><line x1="264" y1="112" x2="292" y2="112" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wh)"></line><line x1="414" y1="112" x2="468" y2="112" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wh)"></line><line x1="590" y1="112" x2="618" y2="112" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wh)"></line><text x="79" y="150" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">event in same txn</text><text x="214" y="150" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">one job per</text><text x="214" y="164" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">endpoint</text><text x="354" y="150" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">sign, POST,</text><text x="354" y="164" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">timeout ~10 s</text><text x="530" y="150" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">verify, dedupe,</text><text x="530" y="164" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">return 2xx fast</text><text x="680" y="150" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">do the work</text><text x="680" y="164" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">asynchronously</text><line x1="442" y1="70" x2="442" y2="250" stroke="var(--cds-chart-axis)" stroke-dasharray="5 4"></line><rect x="294" y="200" width="120" height="40" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="354.0" y="225.0" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">retry + DLQ</text><line x1="404" y1="134" x2="404" y2="198" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wh)"></line><text x="354" y="258" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">backoff for hours or days;</text><text x="354" y="272" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">then disable + alert</text><text x="24" y="292" font-size="11.5" fill="var(--cds-text-secondary)">Delivery is at-least-once and unordered, so receivers must be idempotent.</text></svg>