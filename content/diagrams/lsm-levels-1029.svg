<svg viewBox="0 0 760 330" role="img" aria-label="LSM tree write path: WAL and memtable, flush to L0, compaction into larger levels" font-size="13"><defs><marker id="lsa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Writes land in memory, then move down through larger sorted levels</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Leveled compaction, size multiplier 10. Each level below L0 is one sorted run.</text><text x="24" y="92" font-weight="600" fill="var(--cds-text-primary)">Memory</text><rect x="130" y="70" width="150" height="34" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="205" y="92" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">memtable (sorted)</text><rect x="300" y="70" width="150" height="34" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.06" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="375" y="92" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">immutable memtable</text><path d="M280,87 L298,87" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#lsa)"></path><text x="24" y="146" font-weight="600" fill="var(--cds-text-primary)">Disk</text><rect x="500" y="124" width="230" height="34" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="615" y="146" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">WAL (append-only, for recovery)</text><text x="24" y="170" font-weight="600" fill="var(--cds-text-primary)">L0</text><rect x="130" y="152" width="50" height="28" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><rect x="188" y="152" width="50" height="28" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><rect x="246" y="152" width="50" height="28" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><rect x="304" y="152" width="50" height="28" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="372" y="171" font-size="11.5" fill="var(--cds-text-secondary)">overlapping files, one per flush</text><path d="M375,104 L230,150" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#lsa)"></path><text x="250" y="128" font-size="11.5" fill="var(--cds-text-secondary)">flush</text><text x="24" y="220" font-weight="600" fill="var(--cds-text-primary)">L1</text><rect x="130" y="202" width="120" height="28" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="262" y="221" font-size="11.5" fill="var(--cds-text-secondary)">1 unit, no overlaps</text><text x="24" y="270" font-weight="600" fill="var(--cds-text-primary)">L2</text><rect x="130" y="252" width="600" height="28" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="430" y="271" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">10x L1</text><path d="M100,166 C80,190 80,205 126,214" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#lsa)"></path><text x="56" y="196" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">compact</text><path d="M100,216 C80,240 80,255 126,264" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#lsa)"></path><text x="56" y="246" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">compact</text><text x="24" y="312" font-size="11.5" fill="var(--cds-text-secondary)">A read checks the memtables, then each L0 file, then one file per level; Bloom filters skip most.</text></svg>