<svg viewBox="0 0 760 360" role="img" aria-label="Events plotted by event time and processing time, with a watermark and a late event" font-size="13"><defs><marker id="sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Events arrive late and out of order; the watermark decides when a window is done</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Each dot is an event: when it happened (x) vs. when the pipeline saw it (y).</text><line x1="90" y1="290" x2="660" y2="290" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#sw)"></line><line x1="90" y1="290" x2="90" y2="60" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#sw)"></line><text x="650" y="312" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">event time</text><text x="80" y="70" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">processing</text><text x="80" y="84" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">time</text><rect x="90" y="70" width="180" height="220" fill="var(--cds-chart-categorical-1)" fill-opacity="0.06" stroke="none"></rect><line x1="270" y1="70" x2="270" y2="290" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4" stroke-width="0.75"></line><text x="180" y="306" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">12:00–12:01</text><rect x="270" y="70" width="180" height="220" fill="var(--cds-chart-categorical-2)" fill-opacity="0.06" stroke="none"></rect><line x1="450" y1="70" x2="450" y2="290" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4" stroke-width="0.75"></line><text x="360" y="306" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">12:01–12:02</text><rect x="450" y="70" width="180" height="220" fill="var(--cds-chart-categorical-3)" fill-opacity="0.06" stroke="none"></rect><line x1="630" y1="70" x2="630" y2="290" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4" stroke-width="0.75"></line><text x="540" y="306" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">12:02–12:03</text><line x1="90" y1="290" x2="290" y2="90" stroke="var(--cds-chart-axis)" stroke-width="0.75" stroke-dasharray="1 4"></line><path d="M90,260 C210,210 290,140 350,80" fill="none" stroke="var(--cds-chart-categorical-4)" stroke-width="2"></path><text x="358" y="94" font-size="11.5" fill="var(--cds-text-primary)">watermark</text><circle cx="120" cy="250" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="160" cy="220" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="200" cy="195" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="240" cy="170" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="255" cy="130" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="290" cy="150" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="330" cy="120" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="390" cy="100" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="420" cy="85" r="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.7"></circle><circle cx="210" cy="90" r="6" fill="none" stroke="var(--cds-chart-categorical-5)" stroke-width="2"></circle><text x="24" y="330" font-size="11.5" fill="var(--cds-text-primary)">Open circle: a late event. It happened at 12:00:40 but arrived after the watermark passed 12:01.</text><text x="24" y="350" font-size="11.5" fill="var(--cds-text-secondary)">When the watermark passes a window's end, it fires. Later events get dropped, set aside, or update it.</text></svg>