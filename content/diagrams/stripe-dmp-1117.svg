<svg viewBox="0 0 760 350" role="img" aria-label="Stripe Data Movement Platform: six steps of a chunk migration and the versioned traffic switch" font-size="13"><defs><marker id="dm1117" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Moving a chunk between shards while it serves traffic</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Only step 5 touches live traffic, and it is designed to finish in under two seconds.</text><rect x="24" y="80" width="112" height="50" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="80" y="101" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">1 register</text><text x="80" y="117" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">intent + indexes</text><rect x="146" y="80" width="112" height="50" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="202" y="101" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">2 bulk import</text><text x="202" y="117" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">snapshot at T</text><line x1="136" y1="105" x2="145" y2="105" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dm1117)"></line><rect x="268" y="80" width="112" height="50" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="324" y="101" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">3 replicate</text><text x="324" y="117" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">oplog via Kafka</text><line x1="258" y1="105" x2="267" y2="105" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dm1117)"></line><rect x="390" y="80" width="112" height="50" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="446" y="101" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">4 verify</text><text x="446" y="117" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">compare snapshots</text><line x1="380" y1="105" x2="389" y2="105" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dm1117)"></line><rect x="512" y="80" width="112" height="50" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="568" y="101" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">5 switch</text><text x="568" y="117" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">versioned gating</text><line x1="502" y1="105" x2="511" y2="105" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dm1117)"></line><rect x="634" y="80" width="112" height="50" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="690" y="101" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">6 deregister</text><text x="690" y="117" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">drop source</text><line x1="624" y1="105" x2="633" y2="105" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dm1117)"></line><line x1="512" y1="130" x2="60" y2="170" stroke="var(--cds-chart-axis)" stroke-dasharray="4 4"></line><line x1="624" y1="130" x2="700" y2="170" stroke="var(--cds-chart-axis)" stroke-dasharray="4 4"></line><rect x="60" y="170" width="640" height="110" rx="10" fill="var(--cds-chart-categorical-4)" fill-opacity="0.08" stroke="var(--cds-chart-categorical-4)" stroke-width="1"></rect><text x="170" y="200" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">a bump token</text><text x="170" y="218" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">source shard rejects</text><text x="170" y="232" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">reads + writes for chunk</text><text x="380" y="200" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">b drain</text><text x="380" y="218" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">replication applies</text><text x="380" y="232" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">last writes to target</text><line x1="240" y1="208" x2="308" y2="208" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dm1117)"></line><text x="590" y="200" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">c reroute</text><text x="590" y="218" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">metadata: new shard</text><text x="590" y="232" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">+ new token; proxies follow</text><line x1="450" y1="208" x2="518" y2="208" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dm1117)"></line><text x="380" y="266" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">under 2 s end to end; rejected requests succeed on retry</text><text x="24" y="312" font-size="11.5" fill="var(--cds-text-secondary)">Replication is bidirectional, so traffic can be switched back to the source if the target misbehaves.</text><text x="24" y="332" font-size="11.5" fill="var(--cds-text-secondary)">Source: Stripe engineering blog, June 2024.</text></svg>