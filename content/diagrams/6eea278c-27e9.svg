<svg viewBox="0 0 760 300" role="img" aria-label="Two ways Redis gets data from RAM to disk" font-size="13"><defs><marker id="persist-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Two ways Redis gets data from RAM to disk</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M200 120H280" marker-end="url(#persist-arrow)"></path><path d="M480 120H536" marker-end="url(#persist-arrow)"></path><path d="M200 220H280" marker-end="url(#persist-arrow)"></path><path d="M480 220H536" marker-end="url(#persist-arrow)"></path></g><g><rect x="24" y="80" width="176" height="170" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="112" y="150" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Main thread</text><text x="112" y="170" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">dataset in RAM,</text><text x="112" y="186" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">runs every command</text></g><g><rect x="280" y="92" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="114" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Forked child</text><text x="380" y="132" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">sees a frozen COW copy</text><rect x="536" y="92" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="636" y="114" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">RDB snapshot</text><text x="636" y="132" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">compact point-in-time file</text></g><g><rect x="280" y="192" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="214" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">AOF buffer</text><text x="380" y="232" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">every write, as RESP</text><rect x="536" y="192" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="636" y="214" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Append-only file</text><text x="636" y="232" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">fsync every second</text></g><text x="240" y="112" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">fork()</text><text x="508" y="112" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">write</text><text x="240" y="212" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">each write</text><text x="508" y="212" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">flush</text><text x="24" y="280" font-size="11.5" fill="var(--cds-text-secondary)">An AOF rewrite forks a child the same way and writes a fresh, compact base file.</text></svg>
