<svg viewBox="0 0 760 330" role="img" aria-label="Connection fan-in from many application pods through PgBouncer to a small number of Postgres connections" font-size="13"><defs><marker id="cp1125" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Two layers of pooling: many clients, few database backends</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Example: 50 pods with a pool of 20 each would need 1,000 Postgres processes without a pooler.</text><rect x="24" y="76" width="150" height="42" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="99" y="95" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">pod 1</text><text x="99" y="110" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">app pool: 20</text><line x1="176" y1="97" x2="318" y2="170" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#cp1125)"></line><rect x="24" y="128" width="150" height="42" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="99" y="147" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">pod 2</text><text x="99" y="162" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">app pool: 20</text><line x1="176" y1="149" x2="318" y2="170" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#cp1125)"></line><rect x="24" y="180" width="150" height="42" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="99" y="199" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">pod 3</text><text x="99" y="214" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">app pool: 20</text><line x1="176" y1="201" x2="318" y2="170" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#cp1125)"></line><rect x="24" y="232" width="150" height="42" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="99" y="251" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">pod 50</text><text x="99" y="266" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">app pool: 20</text><line x1="176" y1="253" x2="318" y2="170" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#cp1125)"></line><text x="99" y="226" text-anchor="middle" font-size="14" fill="var(--cds-text-primary)">⋮</text><rect x="320" y="135" width="150" height="70" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="395" y="168" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">PgBouncer</text><text x="395" y="183" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">transaction mode</text><line x1="472" y1="170" x2="588" y2="170" stroke="var(--cds-chart-axis)" stroke-width="3" marker-end="url(#cp1125)"></line><rect x="590" y="120" width="146" height="100" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="663" y="168" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">Postgres</text><text x="663" y="183" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">~40 backends</text><text x="246" y="118" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">1,000 client conns</text><text x="530" y="160" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">40 server conns</text><text x="395" y="226" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">queues clients when</text><text x="395" y="240" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">all server conns busy</text><text x="24" y="300" font-size="11.5" fill="var(--cds-text-secondary)">The database does its best work with roughly a few connections per CPU core actively running queries.</text><text x="24" y="318" font-size="11.5" fill="var(--cds-text-secondary)">Waiting belongs in a cheap queue (the pooler), not in hundreds of contending database processes.</text></svg>