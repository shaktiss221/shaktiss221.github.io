<svg viewBox="0 0 760 360" role="img" aria-label="N+1 queries from naive resolvers versus batched loading with DataLoader" font-size="13"><defs><marker id="gq1118" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">One GraphQL query, 51 database queries or 2</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Query: posts(first: 50) { title author { name } }. Each field has its own resolver.</text><text x="190" y="82" font-size="12.5" fill="var(--cds-text-primary)" text-anchor="middle">Naive resolvers</text><text x="570" y="82" font-size="12.5" fill="var(--cds-text-primary)" text-anchor="middle">With DataLoader</text><line x1="380" y1="70" x2="380" y2="300" stroke="var(--cds-chart-axis)" stroke-dasharray="5 4"></line><rect x="110" y="96" width="160" height="40" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="190" y="120" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">posts resolver</text><rect x="30" y="176" width="74" height="34" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="67" y="197" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">author #1</text><line x1="190" y1="136" x2="70" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><rect x="120" y="176" width="80" height="34" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="157" y="197" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">author #2</text><line x1="190" y1="136" x2="160" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><rect x="210" y="176" width="80" height="34" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="247" y="197" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">author #3</text><line x1="190" y1="136" x2="250" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><rect x="290" y="176" width="80" height="34" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="327" y="197" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">author #50</text><line x1="190" y1="136" x2="340" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><rect x="60" y="244" width="260" height="40" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="190" y="268" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">DB: 1 + 50 queries</text><line x1="70" y1="210" x2="80" y2="242" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><line x1="160" y1="210" x2="160" y2="242" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><line x1="250" y1="210" x2="250" y2="242" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><line x1="340" y1="210" x2="300" y2="242" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><rect x="490" y="96" width="160" height="40" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="570" y="120" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">posts resolver</text><rect x="420" y="176" width="300" height="34" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="570" y="197" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">50 author loads, same tick</text><line x1="570" y1="136" x2="570" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><rect x="440" y="244" width="260" height="40" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="570" y="268" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">DB: 2 queries</text><line x1="570" y1="210" x2="570" y2="242" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#gq1118)"></line><text x="580" y="230" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">batch: WHERE id IN (...)</text><text x="24" y="320" font-size="11.5" fill="var(--cds-text-secondary)">DataLoader collects keys requested in the same tick, makes one batched call, and caches per request.</text><text x="24" y="340" font-size="11.5" fill="var(--cds-text-secondary)">Latency drops from 51 round trips (or a big parallel burst) to 2.</text></svg>