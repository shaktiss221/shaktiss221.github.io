<svg viewBox="0 0 760 330" role="img" aria-label="Layers of load balancing from DNS to client-side balancing" font-size="13"><defs><marker id="lba" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A request usually passes through several load balancers</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Each layer spreads load over the next and decides what counts as healthy.</text><rect x="24" y="70" width="180" height="36" rx="7" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="114" y="93" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">DNS / anycast</text><text x="220" y="93" font-size="12" fill="var(--cds-text-secondary)">picks a region or edge site</text><line x1="114" y1="106" x2="114" y2="126" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#lba)"></line><rect x="24" y="128" width="180" height="36" rx="7" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="114" y="151" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">L4 balancer</text><text x="220" y="151" font-size="12" fill="var(--cds-text-secondary)">spreads TCP/UDP flows (Maglev, Katran, NLB)</text><line x1="114" y1="164" x2="114" y2="184" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#lba)"></line><rect x="24" y="186" width="180" height="36" rx="7" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="114" y="209" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">L7 proxy</text><text x="220" y="209" font-size="12" fill="var(--cds-text-secondary)">routes HTTP/gRPC requests (Envoy, NGINX, ALB)</text><line x1="114" y1="222" x2="114" y2="242" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#lba)"></line><rect x="24" y="244" width="180" height="36" rx="7" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="114" y="267" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Client-side LB</text><text x="220" y="267" font-size="12" fill="var(--cds-text-secondary)">service picks a backend per request (gRPC, mesh)</text><rect x="574" y="250" width="28" height="24" rx="7" fill="var(--cds-chart-categorical-5)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><rect x="610" y="250" width="28" height="24" rx="7" fill="var(--cds-chart-categorical-5)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><rect x="646" y="250" width="28" height="24" rx="7" fill="var(--cds-chart-categorical-5)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><rect x="682" y="250" width="28" height="24" rx="7" fill="var(--cds-chart-categorical-5)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><rect x="718" y="250" width="28" height="24" rx="7" fill="var(--cds-chart-categorical-5)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><text x="574" y="292" font-size="11.5" fill="var(--cds-text-secondary)">backends</text><line x1="545" y1="262" x2="568" y2="262" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#lba)"></line><text x="24" y="322" font-size="11.5" fill="var(--cds-text-secondary)">Granularity gets finer at each step: region, connection, then individual request.</text></svg>