<svg viewBox="0 0 760 370" role="img" aria-label="Fencing tokens stop a paused client from overwriting newer data" font-size="13"><defs><marker id="fe1116" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A lease alone can't stop a paused client</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">The storage service must check a fencing token that only ever increases.</text><text x="24" y="104" font-size="12" font-weight="600" fill="var(--cds-text-primary)">client 1</text><line x1="120" y1="100" x2="736" y2="100" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 4"></line><text x="24" y="169" font-size="12" font-weight="600" fill="var(--cds-text-primary)">lock service</text><line x1="120" y1="165" x2="736" y2="165" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 4"></line><text x="24" y="234" font-size="12" font-weight="600" fill="var(--cds-text-primary)">client 2</text><line x1="120" y1="230" x2="736" y2="230" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 4"></line><text x="24" y="299" font-size="12" font-weight="600" fill="var(--cds-text-primary)">storage</text><line x1="120" y1="295" x2="736" y2="295" stroke="var(--cds-chart-axis)" stroke-width="1" stroke-dasharray="3 4"></line><line x1="150" y1="160" x2="170" y2="106" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#fe1116)"></line><text x="178" y="88" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">lease, token 33</text><rect x="200" y="93" width="330" height="14" rx="4" fill="var(--cds-chart-categorical-4)" fill-opacity="0.35"></rect><text x="365" y="124" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">stop-the-world pause (GC, swap, VM migration)</text><line x1="330" y1="150" x2="330" y2="180" stroke="var(--cds-chart-categorical-4)" stroke-width="2.5"></line><text x="330" y="196" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">lease expires</text><line x1="380" y1="170" x2="400" y2="224" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#fe1116)"></line><text x="408" y="216" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">lease, token 34</text><line x1="440" y1="236" x2="470" y2="289" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#fe1116)"></line><text x="478" y="281" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">write (34) ok</text><line x1="560" y1="106" x2="620" y2="289" stroke="var(--cds-chart-categorical-4)" stroke-width="2" marker-end="url(#fe1116)"></line><text x="630" y="281" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">write (33)</text><text x="630" y="316" font-size="11" fill="var(--cds-text-primary)" text-anchor="start">rejected: 33 &lt; 34</text><text x="24" y="356" font-size="11.5" fill="var(--cds-text-secondary)">Without the check, client 1 overwrites client 2's data while believing it still holds the lock.</text></svg>