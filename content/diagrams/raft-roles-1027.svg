<svg viewBox="0 0 760 300" role="img" aria-label="Raft server roles and the transitions between them" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Every Raft server is a follower, a candidate or a leader</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Seeing a higher term in any message sends a server back to follower.</text><defs><marker id="rfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><rect x="60" y="120" width="140" height="50" rx="10" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.5"></rect><text x="130" y="150" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Follower</text><rect x="310" y="120" width="140" height="50" rx="10" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.5"></rect><text x="380" y="150" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Candidate</text><rect x="560" y="120" width="140" height="50" rx="10" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.5"></rect><text x="630" y="150" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Leader</text><path d="M200,135 L308,135" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rfa)"></path><text x="254" y="127" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">election timeout</text><path d="M450,135 L558,135" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rfa)"></path><text x="504" y="127" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">votes from majority</text><path d="M310,160 L202,160" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rfa)"></path><text x="256" y="182" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">sees current leader</text><path d="M360,120 C360,80 400,80 400,118" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rfa)"></path><text x="380" y="74" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">timeout: new term, try again</text><path d="M630,170 C630,250 130,250 130,172" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rfa)"></path><text x="380" y="240" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">sees a higher term</text><text x="24" y="288" font-size="11.5" fill="var(--cds-text-secondary)">Election timeouts are randomized (the paper suggests 150 to 300 ms) so split votes rarely repeat.</text></svg>