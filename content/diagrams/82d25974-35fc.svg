<svg viewBox="0 0 760 384" role="img" aria-label="The outbox turns a dual write into one local commit" font-size="13"><defs><marker id="outbox-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">The outbox turns a dual write into one local commit</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M174 134H214" marker-end="url(#outbox-arrow)"></path><path d="M464 134H504" marker-end="url(#outbox-arrow)"></path><path d="M620 170V264" marker-end="url(#outbox-arrow)"></path><path d="M504 300H464" marker-end="url(#outbox-arrow)"></path></g><g><rect x="24" y="98" width="150" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="99" y="126" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Order service</text><text x="99" y="146" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">handles the request</text></g><g><rect x="214" y="60" width="250" height="160" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="339" y="84" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">One DB transaction</text><rect x="230" y="100" width="218" height="44" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="339" y="127" text-anchor="middle" fill="var(--cds-text-primary)">orders: new row</text><rect x="230" y="156" width="218" height="44" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="339" y="183" text-anchor="middle" fill="var(--cds-text-primary)">outbox: event row</text></g><g><rect x="504" y="98" width="232" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="620" y="122" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Outbox relay</text><text x="620" y="142" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">polls the table, or</text><text x="620" y="158" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">tails the WAL (CDC)</text></g><g><rect x="504" y="264" width="232" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="620" y="292" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Message broker</text><text x="620" y="312" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">at-least-once delivery</text></g><g><rect x="214" y="264" width="250" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="339" y="292" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Consumers</text><text x="339" y="312" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">dedupe by event ID (inbox)</text></g><text x="632" y="222" font-size="11.5" fill="var(--cds-text-secondary)">publish, then mark sent</text><text x="24" y="366" font-size="11.5" fill="var(--cds-text-secondary)">A crash between publish and mark-sent republishes the event, so consumers must still dedupe.</text></svg>
