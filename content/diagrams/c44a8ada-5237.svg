"var(--cds-chart-categorical-1)"></circle><text x="350.2748671111001" y="120.49706687343944" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">A</text><text x="328" y="375.09996299037243" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">B</text><text x="130.49706687343945" y="340.27486711110015" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">C</text><text x="124.4970668734394" y="139.72513288889988" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">D (new)</text></g><g><circle cx="452" cy="112" r="7" fill="var(--cds-chart-axis)"></circle><text x="468" y="116" fill="var(--cds-text-primary)">node, placed at hash(node id)</text><circle cx="452" cy="140" r="5" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.5"></circle><text x="468" y="144" fill="var(--cds-text-primary)">key, placed at hash(key)</text><text x="444" y="188" fill="var(--cds-text-primary)">Each key belongs to the first</text><text x="444" y="206" fill="var(--cds-text-primary)">node clockwise from it.</text><text x="444" y="244" fill="var(--cds-text-primary)">When D joins, only the accent arc</text><text x="444" y="262" fill="var(--cds-text-primary)">changes owner: k3 moves from A to D.</text><text x="444" y="300" fill="var(--cds-text-secondary)">k1, k2 and k4 stay where they were.</text></g></svg>
