<svg viewBox="0 0 760 340" role="img" aria-label="A relationship-based authorization check walking from a document to a folder to a group to a user" font-size="13"><defs><marker id="zb1127" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Check: can user:bob view doc:roadmap?</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Stored tuples are edges; the schema says which edges imply which permissions.</text><rect x="24" y="90" width="150" height="52" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="99" y="114" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">doc:roadmap</text><text x="99" y="129" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">viewer?</text><rect x="214" y="90" width="150" height="52" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="289" y="114" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">folder:product</text><text x="289" y="129" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">viewer</text><rect x="404" y="90" width="150" height="52" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="479" y="114" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">group:pm</text><text x="479" y="129" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">member</text><rect x="594" y="90" width="140" height="52" rx="8" fill="var(--cds-chart-categorical-5)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><text x="664" y="120" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">user:bob</text><line x1="174" y1="116" x2="212" y2="116" stroke="var(--cds-chart-categorical-4)" stroke-width="2" marker-end="url(#zb1127)"></line><line x1="364" y1="116" x2="402" y2="116" stroke="var(--cds-chart-categorical-4)" stroke-width="2" marker-end="url(#zb1127)"></line><line x1="554" y1="116" x2="592" y2="116" stroke="var(--cds-chart-categorical-4)" stroke-width="2" marker-end="url(#zb1127)"></line><text x="193" y="166" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">parent</text><text x="383" y="166" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">viewer grant</text><text x="573" y="166" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">member</text><text x="24" y="206" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Tuples stored</text><text x="24" y="228" font-size="11.5" font-family="monospace" fill="var(--cds-text-secondary)">doc:roadmap#parent@folder:product</text><text x="24" y="246" font-size="11.5" font-family="monospace" fill="var(--cds-text-secondary)">folder:product#viewer@group:pm#member</text><text x="24" y="264" font-size="11.5" font-family="monospace" fill="var(--cds-text-secondary)">group:pm#member@user:bob</text><text x="400" y="206" font-size="12" font-weight="600" fill="var(--cds-text-primary)">Schema rule</text><text x="400" y="228" font-size="11.5" font-family="monospace" fill="var(--cds-text-secondary)">doc viewer = direct viewers</text><text x="400" y="246" font-size="11.5" font-family="monospace" fill="var(--cds-text-secondary)">  + editors</text><text x="400" y="264" font-size="11.5" font-family="monospace" fill="var(--cds-text-secondary)">  + viewers of parent folder</text><text x="24" y="316" font-size="11.5" fill="var(--cds-text-secondary)">Answer: allowed. Revoke one tuple (bob leaves group:pm) and every document under the folder updates at once.</text></svg>