<svg viewBox="0 0 760 492" role="img" aria-label="Each request passes four checks, from per-user limits to whole-system shedding" font-size="13"><defs><marker id="rl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Each request passes four checks, from per-user limits to whole-system shedding</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M360 84V108" marker-end="url(#rl-arrow)"></path><path d="M360 164V188" marker-end="url(#rl-arrow)"></path><path d="M360 244V268" marker-end="url(#rl-arrow)"></path><path d="M360 324V348" marker-end="url(#rl-arrow)"></path><path d="M360 404V428" marker-end="url(#rl-arrow)"></path></g><g fill="none" stroke="var(--cds-chart-status-critical)" stroke-width="1.25"><path d="M520 136H572"></path><path d="M520 216H572"></path><path d="M520 296H572"></path><path d="M520 376H572"></path></g><g><rect x="260" y="48" width="200" height="36" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="360" y="70" text-anchor="middle" fill="var(--cds-text-primary)">Incoming API request</text></g><g><rect x="200" y="108" width="320" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="360" y="130" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">1. Request rate limiter</text><text x="360" y="148" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">token bucket per user, with room for bursts</text></g><g><rect x="200" y="188" width="320" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="360" y="210" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">2. Concurrent requests limiter</text><text x="360" y="228" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">caps requests in flight per user</text></g><g><rect x="200" y="268" width="320" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="360" y="290" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">3. Fleet usage load shedder</text><text x="360" y="308" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">keeps a share of the fleet for critical methods</text></g><g><rect x="200" y="348" width="320" height="56" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="360" y="370" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">4. Worker utilization load shedder</text><text x="360" y="388" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">sheds test traffic, then GETs, then POSTs</text></g><g><rect x="260" y="428" width="200" height="40" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="360" y="452" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">API handler</text></g><text x="580" y="140" font-size="12" fill="var(--cds-text-primary)">429 Too Many Requests</text><text x="580" y="220" font-size="12" fill="var(--cds-text-primary)">429 Too Many Requests</text><text x="580" y="300" font-size="12" fill="var(--cds-text-primary)">503 Service Unavailable</text><text x="580" y="380" font-size="12" fill="var(--cds-text-primary)">503 Service Unavailable</text><g><path d="M176 108V244" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></path><text x="166" y="180" text-anchor="end" font-size="12" fill="var(--cds-text-secondary)">about the user</text></g><g><path d="M176 268V404" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></path><text x="166" y="340" text-anchor="end" font-size="12" fill="var(--cds-text-secondary)">about the system</text></g></svg>
