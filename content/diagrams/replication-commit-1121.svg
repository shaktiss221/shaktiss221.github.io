<svg viewBox="0 0 760 380" role="img" aria-label="Asynchronous versus synchronous replication commit timelines" font-size="13"><defs><marker id="rp1121" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">When does "committed" mean "safe on two machines"?</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Same write, two replication modes. Time runs left to right.</text><text x="24" y="82" font-size="11" fill="var(--cds-text-primary)" text-anchor="start" font-weight="600">Asynchronous (default)</text><text x="24" y="109" font-size="12" font-weight="600" fill="var(--cds-text-primary)">client</text><line x1="110" y1="105" x2="736" y2="105" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><text x="24" y="149" font-size="12" font-weight="600" fill="var(--cds-text-primary)">primary</text><line x1="110" y1="145" x2="736" y2="145" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><text x="24" y="189" font-size="12" font-weight="600" fill="var(--cds-text-primary)">replica</text><line x1="110" y1="185" x2="736" y2="185" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><line x1="130" y1="108" x2="170" y2="142" stroke="var(--cds-chart-axis)" stroke-width="1.6" marker-end="url(#rp1121)"></line><text x="178" y="137" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start" >COMMIT</text><line x1="230" y1="142" x2="270" y2="108" stroke="var(--cds-chart-axis)" stroke-width="1.6" marker-end="url(#rp1121)"></line><text x="278" y="104" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start" >OK after local WAL flush</text><line x1="330" y1="148" x2="470" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.6" marker-end="url(#rp1121)"></line><text x="478" y="188" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start" >WAL arrives later</text><rect x="272" y="150" width="200" height="12" rx="3" fill="var(--cds-chart-categorical-4)" fill-opacity="0.35"></rect><text x="372" y="212" font-size="11" fill="var(--cds-chart-categorical-4)" text-anchor="middle" >primary dies here: acknowledged write lost</text><text x="24" y="232" font-size="11" fill="var(--cds-text-primary)" text-anchor="start" font-weight="600">Synchronous (wait for a standby flush)</text><text x="24" y="259" font-size="12" font-weight="600" fill="var(--cds-text-primary)">client</text><line x1="110" y1="255" x2="736" y2="255" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><text x="24" y="299" font-size="12" font-weight="600" fill="var(--cds-text-primary)">primary</text><line x1="110" y1="295" x2="736" y2="295" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><text x="24" y="339" font-size="12" font-weight="600" fill="var(--cds-text-primary)">replica</text><line x1="110" y1="335" x2="736" y2="335" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><line x1="130" y1="258" x2="170" y2="292" stroke="var(--cds-chart-axis)" stroke-width="1.6" marker-end="url(#rp1121)"></line><text x="178" y="287" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start" >COMMIT</text><line x1="220" y1="298" x2="300" y2="332" stroke="var(--cds-chart-axis)" stroke-width="1.6" marker-end="url(#rp1121)"></line><text x="308" y="346" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start" >standby flushes</text><line x1="380" y1="332" x2="440" y2="298" stroke="var(--cds-chart-axis)" stroke-width="1.6" marker-end="url(#rp1121)"></line><text x="448" y="316" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start" >ack</text><line x1="470" y1="292" x2="520" y2="258" stroke="var(--cds-chart-axis)" stroke-width="1.6" marker-end="url(#rp1121)"></line><text x="528" y="254" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start" >OK: on two machines</text><rect x="180" y="300" width="290" height="10" rx="3" fill="var(--cds-chart-categorical-2)" fill-opacity="0.35"></rect><text x="540" y="302" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start" >commit waits a network round trip</text><text x="24" y="372" font-size="11.5" fill="var(--cds-text-secondary)">If the only sync standby is down, writes block unless something (Patroni, quorum ANY k) changes the rule.</text></svg>