<svg viewBox="0 0 760 300" role="img" aria-label="Retry amplification: retries at every layer multiply load on the deepest service" font-size="13"><defs><marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Retries at every layer multiply: one user request, up to 256 database calls</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Each layer makes 1 attempt + 3 retries when the layer below fails. Worst case when the database is struggling:</text><rect x="40" y="216" width="96" height="14" rx="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="88" y="208" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">1×</text><text x="88" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">client</text><line x1="140" y1="224" x2="178" y2="224" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#ra)"></line><rect x="182" y="190" width="96" height="40" rx="5" fill="var(--cds-chart-categorical-2)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="230" y="182" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">4×</text><text x="230" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">gateway</text><line x1="282" y1="224" x2="320" y2="224" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#ra)"></line><rect x="324" y="160" width="96" height="70" rx="5" fill="var(--cds-chart-categorical-2)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="372" y="152" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">16×</text><text x="372" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">service A</text><line x1="424" y1="224" x2="462" y2="224" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#ra)"></line><rect x="466" y="125" width="96" height="105" rx="5" fill="var(--cds-chart-categorical-3)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="514" y="117" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">64×</text><text x="514" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">service B</text><line x1="566" y1="224" x2="604" y2="224" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#ra)"></line><rect x="608" y="90" width="96" height="140" rx="5" fill="var(--cds-chart-categorical-4)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="656" y="82" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">256×</text><text x="656" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">database</text><text x="24" y="268" font-size="11.5" fill="var(--cds-text-secondary)">Bar heights are log-scaled. Retry at one layer only, use retry budgets, and pass deadlines down,</text><text x="24" y="286" font-size="11.5" fill="var(--cds-text-secondary)">so a struggling dependency sees less traffic, not 256 times more.</text></svg>