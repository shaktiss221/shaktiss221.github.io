<svg viewBox="0 0 760 340" role="img" aria-label="Recursive DNS resolution from stub resolver through root, TLD and authoritative servers" font-size="13"><defs><marker id="dn1113" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">One lookup, four kinds of server</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">A cold lookup for api.example.com. Every answer and referral is cached for its TTL.</text><rect x="24" y="160" width="130" height="50" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="89" y="183" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">app + stub</text><text x="89" y="198" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">OS resolver library</text><rect x="230" y="150" width="160" height="70" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="310" y="183" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">recursive resolver</text><text x="310" y="198" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">ISP, 1.1.1.1, VPC</text><rect x="540" y="76" width="196" height="46" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="638" y="97" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">root servers</text><text x="638" y="112" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">13 names, anycast</text><rect x="540" y="162" width="196" height="46" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="638" y="183" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">.com TLD servers</text><text x="638" y="198" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">delegation for example.com</text><rect x="540" y="248" width="196" height="46" rx="8" fill="var(--cds-chart-categorical-5)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-5)" stroke-width="1.25"></rect><text x="638" y="269" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">example.com auth</text><text x="638" y="284" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">holds the A record</text><line x1="154" y1="178" x2="228" y2="178" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dn1113)"></line><line x1="228" y1="194" x2="156" y2="194" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dn1113)"></line><text x="192" y="236" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">1 query, 5 answer</text><line x1="390" y1="160" x2="538" y2="102" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dn1113)"></line><text x="410" y="112" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">2 root: .com NS</text><line x1="390" y1="185" x2="538" y2="185" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dn1113)"></line><text x="410" y="178" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">3 TLD: example NS</text><line x1="390" y1="210" x2="538" y2="268" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#dn1113)"></line><text x="410" y="262" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">4 auth: A record</text><text x="24" y="326" font-size="11.5" fill="var(--cds-text-secondary)">Warm caches skip steps 2 to 4; most lookups are one hop from the resolver cache.</text></svg>