<svg viewBox="0 0 760 330" role="img" aria-label="Head-of-line blocking in HTTP/2 over TCP versus HTTP/3 over QUIC when one packet is lost" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">One lost packet: who has to wait?</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Three streams (A, B, C) share one connection. Packet 3, carrying stream B, is lost.</text><text x="24" y="98" font-size="12.5" font-weight="600" fill="var(--cds-text-primary)">HTTP/2 over TCP</text><text x="24" y="114" font-size="11" fill="var(--cds-text-secondary)">one ordered byte stream</text><rect x="230" y="80" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.3" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" ></rect><text x="255" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">A1</text><rect x="290" y="80" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="315" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">B2</text><text x="315" y="132" text-anchor="middle" font-size="11" fill="var(--cds-chart-categorical-4)">lost</text><rect x="350" y="80" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="375" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">C3</text><text x="375" y="132" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">waits</text><rect x="410" y="80" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="435" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">B4</text><text x="435" y="132" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">waits</text><rect x="470" y="80" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="495" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">A5</text><text x="495" y="132" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">waits</text><rect x="530" y="80" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="555" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">C6</text><text x="555" y="132" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">waits</text><rect x="590" y="80" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="615" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">A7</text><text x="615" y="132" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">waits</text><rect x="650" y="80" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="675" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">B8</text><text x="675" y="132" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">waits</text><text x="24" y="188" font-size="12.5" font-weight="600" fill="var(--cds-text-primary)">HTTP/3 over QUIC</text><text x="24" y="204" font-size="11" fill="var(--cds-text-secondary)">independent streams</text><rect x="230" y="170" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.3" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" ></rect><text x="255" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">A1</text><rect x="290" y="170" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="315" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">B2</text><text x="315" y="222" text-anchor="middle" font-size="11" fill="var(--cds-chart-categorical-4)">lost</text><rect x="350" y="170" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.3" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25" ></rect><text x="375" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">C3</text><rect x="410" y="170" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="435" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">B4</text><text x="435" y="222" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">waits</text><rect x="470" y="170" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.3" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" ></rect><text x="495" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">A5</text><rect x="530" y="170" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.3" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25" ></rect><text x="555" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">C6</text><rect x="590" y="170" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.3" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25" ></rect><text x="615" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">A7</text><rect x="650" y="170" width="50" height="36" rx="6" fill="var(--cds-chart-categorical-4)" fill-opacity="0.05" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25" stroke-dasharray="4 3"></rect><text x="675" y="193" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">B8</text><text x="675" y="222" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">waits</text><text x="24" y="282" font-size="11.5" fill="var(--cds-text-secondary)">TCP delivers bytes in order, so everything after the gap waits for the retransmit, even other streams.</text><text x="24" y="302" font-size="11.5" fill="var(--cds-text-secondary)">QUIC orders data per stream, so only stream B waits; A and C are delivered to the application immediately.</text></svg>