<svg viewBox="0 0 760 280" role="img" aria-label="Lifetime of a cached response: fresh, stale-while-revalidate, stale-if-error" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">One cached response over time</text><text x="24" y="50" font-size="12" fill="var(--cds-text-secondary)" font-family="monospace">Cache-Control: max-age=60, stale-while-revalidate=30, stale-if-error=600</text><rect x="40" y="80" width="240" height="36" rx="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.18" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="160.0" y="103" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">fresh</text><rect x="280" y="80" width="200" height="36" rx="5" fill="var(--cds-chart-categorical-2)" fill-opacity="0.18" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="380.0" y="103" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">stale-while-revalidate</text><rect x="480" y="80" width="240" height="36" rx="5" fill="var(--cds-chart-categorical-3)" fill-opacity="0.18" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="600.0" y="103" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">stale-if-error window</text><text x="40" y="134" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">0 s</text><text x="280" y="134" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">60 s</text><text x="480" y="134" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">90 s</text><text x="720" y="134" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">660 s</text><rect x="40" y="157" width="16" height="16" rx="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.18" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="66" y="170" font-size="12" fill="var(--cds-text-primary)">Serve from cache. No request to the origin.</text><rect x="40" y="185" width="16" height="16" rx="5" fill="var(--cds-chart-categorical-2)" fill-opacity="0.18" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="66" y="198" font-size="12" fill="var(--cds-text-primary)">Serve the stale copy now; refresh it in the background.</text><rect x="40" y="213" width="16" height="16" rx="5" fill="var(--cds-chart-categorical-3)" fill-opacity="0.18" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="66" y="226" font-size="12" fill="var(--cds-text-primary)">Must revalidate before serving; if the origin errors, the stale copy may still be served.</text><text x="24" y="268" font-size="11.5" fill="var(--cds-text-secondary)">Revalidation can be cheap: If-None-Match with the ETag returns 304 Not Modified and no body.</text></svg>