<svg viewBox="0 0 760 476" role="img" aria-label="Envelope encryption: KMS guards one small key, your app encrypts the data" font-size="13"><defs><marker id="env-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Envelope encryption: KMS guards one small key, your app encrypts the data</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M320 208V144" marker-end="url(#env-arrow)"></path><path d="M440 144V208" marker-end="url(#env-arrow)"></path><path d="M380 280V344" marker-end="url(#env-arrow)"></path></g><g><rect x="200" y="64" width="360" height="80" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="380" y="92" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">KMS (key held in an HSM)</text><text x="380" y="112" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">holds the key encryption key (KEK)</text><text x="380" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">it never leaves; every use is logged</text></g><g><rect x="200" y="208" width="360" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="236" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Application</text><text x="380" y="256" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">encrypts the data locally with the DEK (AES-256-GCM)</text></g><g><rect x="200" y="344" width="360" height="88" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="372" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Storage, one envelope per object</text><text x="380" y="392" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">the data, encrypted under the DEK</text><text x="380" y="408" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">plus the DEK, encrypted under the KEK</text></g><text x="310" y="180" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">1. GenerateDataKey</text><text x="452" y="180" font-size="11.5" fill="var(--cds-text-secondary)">2. plaintext DEK + encrypted DEK</text><text x="392" y="316" font-size="11.5" fill="var(--cds-text-secondary)">3. store both; discard the plaintext DEK</text><text x="24" y="460" font-size="11.5" fill="var(--cds-text-secondary)">To decrypt: send the encrypted DEK to KMS Decrypt, get the DEK back, decrypt the data locally.</text></svg>
