<svg viewBox="0 0 760 320" role="img" aria-label="Figma logical sharding with views, then physical sharding behind DBProxy" font-size="13"><defs><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Shard logically first, then move data physically</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">The application always talks to DBProxy, which routes by a hash of the shard key.</text><text x="200" y="80" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Step 1: logical sharding</text><rect x="120" y="92" width="160" height="32" rx="7" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="200" y="113" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">DBProxy (Go)</text><text x="570" y="80" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Step 2: physical sharding</text><rect x="490" y="92" width="160" height="32" rx="7" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="570" y="113" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">DBProxy (Go)</text><rect x="70" y="170" width="260" height="110" rx="7" fill="var(--cds-chart-categorical-2)" fill-opacity="0.08" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="200" y="270" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">one physical Postgres</text><rect x="84" y="184" width="52" height="30" rx="7" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="110" y="204" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">view 1</text><line x1="200" y1="124" x2="110" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><rect x="146" y="184" width="52" height="30" rx="7" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="172" y="204" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">view 2</text><line x1="200" y1="124" x2="172" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><rect x="208" y="184" width="52" height="30" rx="7" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="234" y="204" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">view 3</text><line x1="200" y1="124" x2="234" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><rect x="270" y="184" width="52" height="30" rx="7" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="296" y="204" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">view 4</text><line x1="200" y1="124" x2="296" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><text x="200" y="240" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">each view = WHERE hash(key) in range</text><rect x="430" y="184" width="60" height="40" rx="7" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="460" y="208" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">shard 1</text><line x1="570" y1="124" x2="460" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><rect x="502" y="184" width="60" height="40" rx="7" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="532" y="208" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">shard 2</text><line x1="570" y1="124" x2="532" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><rect x="574" y="184" width="60" height="40" rx="7" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="604" y="208" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">shard 3</text><line x1="570" y1="124" x2="604" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><rect x="646" y="184" width="60" height="40" rx="7" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="676" y="208" text-anchor="middle" font-size="11" fill="var(--cds-text-primary)">shard 4</text><line x1="570" y1="124" x2="676" y2="182" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><text x="570" y="250" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">separate Postgres instances</text><line x1="345" y1="220" x2="415" y2="220" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#fg)"></line><text x="24" y="306" font-size="11.5" fill="var(--cds-text-secondary)">Step 1 is a feature-flag rollout that can be undone in seconds; step 2 is a failover once step 1 is proven.</text></svg>