<svg viewBox="0 0 760 300" role="img" aria-label="A progressive rollout: stages of increasing exposure with automated checks between them" font-size="13"><defs><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A progressive rollout widens exposure only while the signals stay healthy</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Bar height = share of traffic or users on the new version. Each gate compares it with the old one.</text><rect x="40" y="227" width="70" height="3" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="75" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">internal</text><line x1="114" y1="222" x2="156" y2="222" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pr)"></line><text x="135" y="214" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">gate</text><rect x="160" y="222" width="70" height="8" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="195" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">canary 1%</text><line x1="234" y1="222" x2="276" y2="222" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pr)"></line><text x="255" y="214" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">gate</text><rect x="280" y="210" width="70" height="20" rx="4" fill="var(--cds-chart-categorical-2)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="315" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">5%</text><line x1="354" y1="222" x2="396" y2="222" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pr)"></line><text x="375" y="214" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">gate</text><rect x="400" y="175" width="70" height="55" rx="4" fill="var(--cds-chart-categorical-2)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="435" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">25%</text><line x1="474" y1="222" x2="516" y2="222" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pr)"></line><text x="495" y="214" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">gate</text><rect x="520" y="140" width="70" height="90" rx="4" fill="var(--cds-chart-categorical-3)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="555" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">50%</text><line x1="594" y1="222" x2="636" y2="222" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pr)"></line><text x="615" y="214" text-anchor="middle" font-size="10.5" fill="var(--cds-text-secondary)">gate</text><rect x="640" y="70" width="70" height="160" rx="4" fill="var(--cds-chart-categorical-3)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="675" y="248" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">100%</text><line x1="30" y1="230" x2="730" y2="230" stroke="var(--cds-chart-axis)" stroke-width="1"></line><text x="24" y="272" font-size="11.5" fill="var(--cds-text-secondary)">Gate: errors, latency and business metrics vs. baseline after a soak time; any failure rolls back.</text><text x="24" y="290" font-size="11.5" fill="var(--cds-text-secondary)">The point is to limit the blast radius: a bad change should hurt 1% of users for minutes, not everyone for hours.</text></svg>