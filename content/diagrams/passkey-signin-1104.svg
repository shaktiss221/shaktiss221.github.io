<svg viewBox="0 0 760 370" role="img" aria-label="Passkey sign-in: the server sends a challenge, the authenticator signs it with a key scoped to the site, the server verifies with the stored public key" font-size="13"><defs><marker id="wa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Signing in with a passkey</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">The private key never leaves the authenticator; the browser ties every signature to the real origin.</text><rect x="15" y="66" width="190" height="34" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="110" y="88" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Authenticator</text><line x1="110" y1="100" x2="110" y2="336" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><rect x="285" y="66" width="190" height="34" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="380" y="88" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Browser</text><line x1="380" y1="100" x2="380" y2="336" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><rect x="555" y="66" width="190" height="34" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="650" y="88" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Server (relying party)</text><line x1="650" y1="100" x2="650" y2="336" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><line x1="650" y1="132" x2="384" y2="132" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wa)"></line><text x="388" y="124" font-size="11.5" fill="var(--cds-text-primary)">1. random challenge, rpId</text><line x1="380" y1="172" x2="114" y2="172" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wa)"></line><text x="118" y="164" font-size="11.5" fill="var(--cds-text-primary)">2. challenge, origin, rpId</text><text x="118" y="200" font-size="11.5" fill="var(--cds-text-primary)">3. user verifies (face, finger, PIN)</text><text x="118" y="216" font-size="11.5" fill="var(--cds-text-primary)">and signs with this site's key</text><line x1="110" y1="254" x2="376" y2="254" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wa)"></line><text x="118" y="246" font-size="11.5" fill="var(--cds-text-primary)">4. signature + credential ID</text><line x1="380" y1="294" x2="646" y2="294" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#wa)"></line><text x="388" y="286" font-size="11.5" fill="var(--cds-text-primary)">5. assertion + clientDataJSON</text><text x="640" y="318" font-size="11.5" fill="var(--cds-text-primary)" text-anchor="end">6. check origin, challenge and</text><text x="640" y="334" font-size="11.5" fill="var(--cds-text-primary)" text-anchor="end">signature using stored public key</text><text x="24" y="360" font-size="11.5" fill="var(--cds-text-secondary)">A phishing site has a different origin: no key exists for it, and its signature would fail the check.</text></svg>