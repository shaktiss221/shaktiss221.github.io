<svg viewBox="0 0 760 330" role="img" aria-label="A composite index sorted by tenant then date, and which queries can seek into it" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Index on (tenant_id, created_at): entries sorted by tenant, then date</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Leaf entries in key order. Each points to a row in the table.</text><rect x="40" y="70" width="230" height="26" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="70" y="88" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">7</text><text x="180" y="88" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">2026-10-01</text><rect x="40" y="100" width="230" height="26" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="70" y="118" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">7</text><text x="180" y="118" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">2026-10-14</text><rect x="40" y="130" width="230" height="26" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="70" y="148" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">7</text><text x="180" y="148" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">2026-11-02</text><rect x="40" y="160" width="230" height="26" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="70" y="178" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">9</text><text x="180" y="178" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">2026-09-30</text><rect x="40" y="190" width="230" height="26" rx="4" fill="var(--cds-chart-categorical-2)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="70" y="208" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">9</text><text x="180" y="208" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">2026-10-20</text><rect x="40" y="220" width="230" height="26" rx="4" fill="var(--cds-chart-categorical-2)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="70" y="238" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">9</text><text x="180" y="238" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">2026-10-28</text><rect x="40" y="250" width="230" height="26" rx="4" fill="var(--cds-chart-categorical-2)" fill-opacity="0.2" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="70" y="268" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">9</text><text x="180" y="268" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">2026-11-03</text><rect x="40" y="280" width="230" height="26" rx="4" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1"></rect><text x="70" y="298" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">12</text><text x="180" y="298" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">2026-10-05</text><line x1="100" y1="70" x2="100" y2="310" stroke="var(--cds-chart-axis)" stroke-width="0.75"></line><text x="300" y="96" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">WHERE tenant_id = 9 AND created_at >= '2026-10-15'</text><text x="300" y="114" font-size="11.5" fill="var(--cds-text-secondary)">Seek to (9, 2026-10-15), read 3 adjacent entries, stop.</text><text x="300" y="170" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">WHERE tenant_id = 9 ORDER BY created_at DESC LIMIT 2</text><text x="300" y="188" font-size="11.5" fill="var(--cds-text-secondary)">Seek to tenant 9's end and walk backward. No sort needed.</text><text x="300" y="244" font-size="12" fill="var(--cds-text-primary)" font-family="monospace">WHERE created_at >= '2026-10-15'</text><text x="300" y="262" font-size="11.5" fill="var(--cds-text-secondary)">Matches are scattered across every tenant. No single seek;</text><text x="300" y="278" font-size="11.5" fill="var(--cds-text-secondary)">needs a full index scan, or skip scan (Postgres 18+).</text></svg>