<svg viewBox="0 0 760 300" role="img" aria-label="Per-worker connection pools versus one shared pool" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Why connection reuse improved: one pool instead of one per worker</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Same origin, same traffic. Each line is a kept-alive connection to the origin.</text><text x="190" y="82" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">NGINX: process per core</text><text x="570" y="82" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Pingora: threads share a pool</text><rect x="40" y="100" width="66" height="30" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="73" y="120" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">worker 1</text><rect x="40" y="150" width="66" height="24" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.1" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="73" y="166" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">pool</text><line x1="73" y1="174" x2="190" y2="230" stroke="var(--cds-chart-axis)" stroke-width="1.2"></line><rect x="120" y="100" width="66" height="30" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="153" y="120" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">worker 2</text><rect x="120" y="150" width="66" height="24" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.1" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="153" y="166" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">pool</text><line x1="153" y1="174" x2="190" y2="230" stroke="var(--cds-chart-axis)" stroke-width="1.2"></line><rect x="200" y="100" width="66" height="30" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="233" y="120" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">worker 3</text><rect x="200" y="150" width="66" height="24" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.1" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="233" y="166" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">pool</text><line x1="233" y1="174" x2="190" y2="230" stroke="var(--cds-chart-axis)" stroke-width="1.2"></line><rect x="280" y="100" width="66" height="30" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="313" y="120" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">worker 4</text><rect x="280" y="150" width="66" height="24" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.1" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="313" y="166" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">pool</text><line x1="313" y1="174" x2="190" y2="230" stroke="var(--cds-chart-axis)" stroke-width="1.2"></line><rect x="130" y="230" width="120" height="30" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="190" y="250" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">origin</text><text x="190" y="282" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">a request can only reuse its own worker's idle connections</text><rect x="420" y="100" width="66" height="30" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="453" y="120" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">thread 1</text><line x1="453" y1="130" x2="570" y2="150" stroke="var(--cds-chart-axis)" stroke-width="1.2" stroke-dasharray="4 3"></line><rect x="500" y="100" width="66" height="30" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="533" y="120" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">thread 2</text><line x1="533" y1="130" x2="570" y2="150" stroke="var(--cds-chart-axis)" stroke-width="1.2" stroke-dasharray="4 3"></line><rect x="580" y="100" width="66" height="30" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="613" y="120" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">thread 3</text><line x1="613" y1="130" x2="570" y2="150" stroke="var(--cds-chart-axis)" stroke-width="1.2" stroke-dasharray="4 3"></line><rect x="660" y="100" width="66" height="30" rx="6" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="693" y="120" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">thread 4</text><line x1="693" y1="130" x2="570" y2="150" stroke="var(--cds-chart-axis)" stroke-width="1.2" stroke-dasharray="4 3"></line><rect x="470" y="150" width="200" height="24" rx="6" fill="var(--cds-chart-categorical-2)" fill-opacity="0.1" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="570" y="166" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">shared connection pool</text><line x1="570" y1="174" x2="570" y2="230" stroke="var(--cds-chart-axis)" stroke-width="1.2"></line><rect x="510" y="230" width="120" height="30" rx="6" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="570" y="250" text-anchor="middle" font-size="12"