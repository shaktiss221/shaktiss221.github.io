<svg viewBox="0 0 760 400" role="img" aria-label="Authorization code flow with PKCE" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Authorization code flow with PKCE</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">The code travels through the browser; tokens only travel on the back channel.</text><defs><marker id="pka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><rect x="15" y="66" width="190" height="34" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="110" y="88" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Client app</text><line x1="110" y1="100" x2="110" y2="378" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><rect x="285" y="66" width="190" height="34" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="380" y="88" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Authorization server</text><line x1="380" y1="100" x2="380" y2="378" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><rect x="555" y="66" width="190" height="34" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="650" y="88" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Resource server (API)</text><line x1="650" y1="100" x2="650" y2="378" stroke="var(--cds-chart-axis)" stroke-dasharray="3 4"></line><line x1="110" y1="136" x2="376" y2="136" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pka)"></line><text x="118" y="128" font-size="11.5" fill="var(--cds-text-primary)">1. authorize: scope, state, challenge</text><line x1="380" y1="180" x2="114" y2="180" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pka)"></line><text x="118" y="172" font-size="11.5" fill="var(--cds-text-primary)">2. login + consent; redirect with code</text><line x1="110" y1="224" x2="376" y2="224" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pka)"></line><text x="118" y="216" font-size="11.5" fill="var(--cds-text-primary)">3. POST /token: code + verifier</text><line x1="380" y1="268" x2="114" y2="268" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pka)"></line><text x="118" y="260" font-size="11.5" fill="var(--cds-text-primary)">4. verifier matches: tokens issued</text><line x1="110" y1="312" x2="646" y2="312" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pka)"></line><text x="118" y="304" font-size="11.5" fill="var(--cds-text-primary)">5. GET /api  Authorization: Bearer &lt;access token&gt;</text><line x1="650" y1="356" x2="114" y2="356" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#pka)"></line><text x="118" y="348" font-size="11.5" fill="var(--cds-text-primary)">6. API validates token (signature, iss, aud, exp, scope)</text></svg>