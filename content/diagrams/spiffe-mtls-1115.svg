<svg viewBox="0 0 760 380" role="img" aria-label="SPIFFE identity issuance and mutual TLS between two workloads" font-size="13"><defs><marker id="mt1115" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker><marker id="mt1115b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-categorical-4)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Identity first, then mutual TLS</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Workloads get short-lived certificates from proof of what they are, not from a stored secret.</text><rect x="290" y="72" width="180" height="50" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="380" y="95" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">SPIRE server</text><text x="380" y="110" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">CA for trust domain</text><rect x="24" y="150" width="240" height="160" rx="10" fill="none" stroke="var(--cds-chart-axis)" stroke-dasharray="5 4"></rect><text x="34" y="168" font-size="11" fill="var(--cds-text-secondary)">node A</text><rect x="496" y="150" width="240" height="160" rx="10" fill="none" stroke="var(--cds-chart-axis)" stroke-dasharray="5 4"></rect><text x="506" y="168" font-size="11" fill="var(--cds-text-secondary)">node B</text><rect x="64" y="178" width="160" height="44" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="144" y="198" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">SPIRE agent</text><text x="144" y="213" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">attested node</text><rect x="64" y="250" width="160" height="46" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="144" y="271" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">orders service</text><text x="144" y="286" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">spiffe://acme/orders</text><rect x="536" y="178" width="160" height="44" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="616" y="198" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">SPIRE agent</text><text x="616" y="213" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">attested node</text><rect x="536" y="250" width="160" height="46" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="616" y="271" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">payments service</text><text x="616" y="286" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">spiffe://acme/payments</text><line x1="200" y1="176" x2="300" y2="124" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#mt1115)"></line><line x1="560" y1="176" x2="460" y2="124" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#mt1115)"></line><text x="212" y="140" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">1 node attestation</text><text x="548" y="140" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">1 node attestation</text><line x1="144" y1="248" x2="144" y2="224" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#mt1115)"></line><text x="150" y="240" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">2 workload API</text><line x1="616" y1="248" x2="616" y2="224" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#mt1115)"></line><text x="510" y="240" font-size="11" fill="var(--cds-text-secondary)" text-anchor="start">2 workload API</text><line x1="226" y1="273" x2="534" y2="273" stroke="var(--cds-chart-categorical-4)" stroke-width="2.5" marker-start="url(#mt1115b)" marker-end="url(#mt1115b)"></line><text x="380" y="264" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">3 mTLS: both present SVIDs</text><text x="380" y="292" font-size="11" fill="var(--cds-text-secondary)" text-anchor="middle">4 authorise by SPIFFE ID</text><text x="24" y="340" font-size="11.5" fill="var(--cds-text-secondary)">Agents verify workloads by kernel facts (pod, service account, binary) and rotate certificates hourly to daily.</text><text x="24" y="360" font-size="11.5" fill="var(--cds-text-secondary)">A service mesh does the same job with a sidecar or node proxy, so application code doesn't change.</text></svg>