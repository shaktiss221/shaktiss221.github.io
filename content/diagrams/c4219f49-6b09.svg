<svg viewBox="0 0 760 392" role="img" aria-label="A unary gRPC call is one HTTP/2 stream that ends in trailers" font-size="13"><defs><marker id="grpc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker><marker id="grpc-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-categorical-1)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A unary gRPC call is one HTTP/2 stream that ends in trailers</text><g><rect x="70" y="52" width="160" height="36" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="150" y="75" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Client stub</text><line x1="150" y1="88" x2="150" y2="344" stroke="var(--cds-chart-grid)" stroke-width="1.25"></line></g><g><rect x="530" y="52" width="160" height="36" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="610" y="75" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Server</text><line x1="610" y1="88" x2="610" y2="344" stroke="var(--cds-chart-grid)" stroke-width="1.25"></line></g><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M150 126H610" marker-end="url(#grpc-arrow)"></path><path d="M150 176H610" marker-end="url(#grpc-arrow)"></path><path d="M610 226H150" marker-end="url(#grpc-arrow)"></path><path d="M610 276H150" marker-end="url(#grpc-arrow)"></path><path d="M610 326H150" stroke="var(--cds-chart-categorical-1)" stroke-width="2" marker-end="url(#grpc-arrow-accent)"></path></g><text x="380" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">HEADERS: POST /acme.user.v1.Users/GetUser, grpc-timeout 2S</text><text x="380" y="168" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">DATA: 5-byte prefix + Protobuf request, END_STREAM</text><text x="380" y="218" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">HEADERS: :status 200, content-type application/grpc</text><text x="380" y="268" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">DATA: 5-byte prefix + Protobuf response</text><text x="380" y="318" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--cds-text-primary)">TRAILERS: grpc-status 0 (OK), END_STREAM</text><text x="24" y="376" font-size="11.5" fill="var(--cds-text-secondary)">The call&#x27;s real outcome is in the trailers; HTTP status 200 only means the stream was set up.</text></svg>
