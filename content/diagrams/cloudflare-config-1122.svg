<svg viewBox="0 0 760 330" role="img" aria-label="Chain of events in the Cloudflare outage of 18 November 2025" font-size="13"><defs><marker id="cf1122" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">A safe-looking change, amplified by a config pipeline</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Cloudflare, 18 November 2025. Each step was reasonable on its own.</text><rect x="24" y="76" width="132" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="90" y="100" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">DB permission</text><text x="90" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">change, 11:05</text><rect x="170" y="76" width="132" height="56" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="236" y="100" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">query returns</text><text x="236" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">duplicate rows</text><line x1="156" y1="104" x2="169" y2="104" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#cf1122)"></line><rect x="316" y="76" width="132" height="56" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="382" y="100" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">feature file</text><text x="382" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">doubles in size</text><line x1="302" y1="104" x2="315" y2="104" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#cf1122)"></line><rect x="462" y="76" width="132" height="56" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="528" y="100" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">pushed to every</text><text x="528" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">machine, every 5 min</text><line x1="448" y1="104" x2="461" y2="104" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#cf1122)"></line><rect x="608" y="76" width="132" height="56" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="674" y="100" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">proxy hits 200</text><text x="674" y="118" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">limit, panics</text><line x1="594" y1="104" x2="607" y2="104" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#cf1122)"></line><line x1="60" y1="210" x2="720" y2="210" stroke="var(--cds-chart-axis)" stroke-width="1.5"></line><circle cx="68" cy="210" r="5" fill="var(--cds-chart-categorical-4)"></circle><text x="82" y="196" text-anchor="end" font-size="12" font-weight="600" fill="var(--cds-text-primary)">11:05</text><text x="82" y="180" text-anchor="end" font-size="11" fill="var(--cds-text-secondary)">change</text><circle cx="95" cy="210" r="5" fill="var(--cds-chart-categorical-4)"></circle><text x="89" y="232" text-anchor="start" font-size="12" font-weight="600" fill="var(--cds-text-primary)">11:20</text><text x="89" y="248" text-anchor="start" font-size="11" fill="var(--cds-text-secondary)">errors begin</text><circle cx="429" cy="210" r="5" fill="var(--cds-chart-categorical-4)"></circle><text x="429" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">14:30</text><text x="429" y="232" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">core traffic back</text><circle cx="704" cy="210" r="5" fill="var(--cds-chart-categorical-4)"></circle><text x="704" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="var(--cds-text-primary)">17:06</text><text x="704" y="232" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">fully recovered</text><text x="24" y="168" font-size="11.5" fill="var(--cds-text-secondary)">Timeline (UTC). Good and bad files alternated every five minutes, so errors came and went.</text><text x="24" y="282" font-size="11.5" fill="var(--cds-text-secondary)">The file was generated internally, so it was trusted; the proxy treated "too many features" as impossible.</text><text x="24" y="302" font-size="11.5" fill="var(--cds-text-secondary)">Fix themes: validate internal config like user input, kill switches, and fail safe instead of panicking.</text></svg>