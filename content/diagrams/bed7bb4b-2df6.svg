<svg viewBox="0 0 760 372" role="img" aria-label="An UPDATE writes a new row version, and each snapshot picks one" font-size="13"><defs><marker id="mvcc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">An UPDATE writes a new row version, and each snapshot picks one</text><text x="24" y="56" font-size="11.5" fill="var(--cds-text-secondary)">One row of accounts, updated by transactions 205 and 310, all three versions in the heap</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M224 124H280" marker-end="url(#mvcc-arrow)"></path><path d="M480 124H536" marker-end="url(#mvcc-arrow)"></path><path d="M380 248V164" marker-end="url(#mvcc-arrow)"></path></g><g><rect x="24" y="84" width="200" height="80" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="124" y="108" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Version 1 (dead)</text><text x="124" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">xmin 100, xmax 205</text><text x="124" y="146" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">balance = 50</text></g><g><rect x="280" y="84" width="200" height="80" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="380" y="108" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Version 2</text><text x="380" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">xmin 205, xmax 310</text><text x="380" y="146" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">balance = 80</text></g><g><rect x="536" y="84" width="200" height="80" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="636" y="108" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Version 3 (uncommitted)</text><text x="636" y="128" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">xmin 310, xmax none</text><text x="636" y="146" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">balance = 95</text></g><g><rect x="280" y="248" width="200" height="80" rx="8" fill="none" fill-opacity="1" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="380" y="272" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Reader&#x27;s snapshot</text><text x="380" y="292" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">205 has committed,</text><text x="380" y="308" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">310 is still running</text></g><text x="252" y="116" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ctid</text><text x="508" y="116" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">ctid</text><text x="390" y="212" font-size="11.5" fill="var(--cds-text-secondary)">sees only this version</text><text x="24" y="356" font-size="11.5" fill="var(--cds-text-secondary)">Vacuum can remove version 1 once no running snapshot is old enough to need it.</text></svg>
