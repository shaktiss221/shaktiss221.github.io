<svg viewBox="0 0 760 320" role="img" aria-label="A trace as a waterfall of spans across services" font-size="13"><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">One trace, five spans: where did 420 ms go?</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Each bar is a span: one unit of work with a start, an end and a parent.</text><line x1="250.0" y1="64" x2="250.0" y2="270" stroke="var(--cds-chart-axis)" stroke-dasharray="2 4" stroke-width="0.75"></line><text x="250.0" y="284" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">0 ms</text><line x1="360.0" y1="64" x2="360.0" y2="270" stroke="var(--cds-chart-axis)" stroke-dasharray="2 4" stroke-width="0.75"></line><text x="360.0" y="284" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">100 ms</text><line x1="470.0" y1="64" x2="470.0" y2="270" stroke="var(--cds-chart-axis)" stroke-dasharray="2 4" stroke-width="0.75"></line><text x="470.0" y="284" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">200 ms</text><line x1="580.0" y1="64" x2="580.0" y2="270" stroke="var(--cds-chart-axis)" stroke-dasharray="2 4" stroke-width="0.75"></line><text x="580.0" y="284" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">300 ms</text><line x1="690.0" y1="64" x2="690.0" y2="270" stroke="var(--cds-chart-axis)" stroke-dasharray="2 4" stroke-width="0.75"></line><text x="690.0" y="284" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">400 ms</text><text x="24" y="89" font-size="12" fill="var(--cds-text-primary)">api-gateway  GET /checkout</text><rect x="250.0" y="75" width="462.0" height="20" rx="4" fill="var(--cds-chart-categorical-1)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="706.0" y="89" font-size="11" fill="var(--cds-text-primary)" text-anchor="end">420 ms</text><text x="38" y="127" font-size="12" fill="var(--cds-text-primary)">cart-svc  GetCart</text><rect x="261.0" y="113" width="55.0" height="20" rx="4" fill="var(--cds-chart-categorical-2)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="322.0" y="127" font-size="11" fill="var(--cds-text-secondary)">50 ms</text><text x="38" y="165" font-size="12" fill="var(--cds-text-primary)">pricing-svc  Quote</text><rect x="327.0" y="151" width="99.0" height="20" rx="4" fill="var(--cds-chart-categorical-2)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="432.0" y="165" font-size="11" fill="var(--cds-text-secondary)">90 ms</text><text x="38" y="203" font-size="12" fill="var(--cds-text-primary)">payments-svc  Charge</text><rect x="437.0" y="189" width="264.0" height="20" rx="4" fill="var(--cds-chart-categorical-3)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="695.0" y="203" font-size="11" fill="var(--cds-text-primary)" text-anchor="end">240 ms</text><text x="52" y="241" font-size="12" fill="var(--cds-text-primary)">postgres  INSERT order</text><rect x="569.0" y="227" width="110.0" height="20" rx="4" fill="var(--cds-chart-categorical-4)" fill-opacity="0.22" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="685.0" y="241" font-size="11" fill="var(--cds-text-secondary)">100 ms</text><text x="24" y="308" font-size="11.5" fill="var(--cds-text-secondary)">Payments takes 240 of the 420 ms, and 100 of those are one database insert.</text></svg>