<svg viewBox="0 0 760 290" role="img" aria-label="Spanner commit wait: pick timestamp at the top of the uncertainty interval, then wait until it is surely past" font-size="13"><defs><marker id="cwa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Commit wait: don't reveal a write until its timestamp has surely passed</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">TrueTime returns an interval [earliest, latest] that contains the real time.</text><line x1="40" y1="200" x2="730" y2="200" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#cwa)"></line><text x="722" y="220" text-anchor="end" font-size="11.5" fill="var(--cds-text-secondary)">real time</text><rect x="120" y="80" width="200" height="26" rx="5" fill="var(--cds-chart-categorical-1)" fill-opacity="0.18" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="220.0" y="97" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">TT.now() at commit start</text><text x="120" y="74" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">earliest</text><text x="320" y="74" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">latest = s</text><line x1="320" y1="106" x2="320" y2="200" stroke="var(--cds-chart-categorical-3)" stroke-width="2"></line><text x="326" y="190" font-size="11.5" fill="var(--cds-text-primary)">commit timestamp s</text><rect x="330" y="130" width="200" height="26" rx="5" fill="var(--cds-chart-categorical-2)" fill-opacity="0.18" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="430.0" y="147" text-anchor="middle" font-size="12" fill="var(--cds-text-primary)">wait until TT.now().earliest > s</text><line x1="530" y1="156" x2="530" y2="200" stroke="var(--cds-chart-axis)" stroke-width="1.5" stroke-dasharray="4 3"></line><text x="536" y="190" font-size="11.5" fill="var(--cds-text-primary)">release locks, reply</text><text x="24" y="244" font-size="11.5" fill="var(--cds-text-secondary)">The wait is about twice the clock uncertainty (a few ms in the 2012 paper).</text><text x="24" y="264" font-size="11.5" fill="var(--cds-text-secondary)">Any transaction that starts after the reply gets a larger timestamp, so timestamp order matches real-time order.</text></svg>