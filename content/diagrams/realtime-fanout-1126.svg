<svg viewBox="0 0 760 330" role="img" aria-label="Slack real-time message flow from sender through channel server to gateway servers and websockets" font-size="13"><defs><marker id="rt1126" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Write path in, fan-out path out</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Slack's real-time design (2023): messages are sent over HTTP and delivered over WebSockets.</text><rect x="24" y="150" width="100" height="48" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="74" y="172" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">sender</text><text x="74" y="187" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">HTTP POST</text><rect x="150" y="150" width="110" height="48" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="205" y="172" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">webapp</text><text x="205" y="187" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">persist to DB</text><rect x="286" y="150" width="110" height="48" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="341" y="172" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">admin server</text><text x="341" y="187" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">stateless</text><rect x="422" y="150" width="120" height="48" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="482" y="172" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">channel server</text><text x="482" y="187" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">hash ring</text><line x1="124" y1="174" x2="148" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rt1126)"></line><line x1="260" y1="174" x2="284" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rt1126)"></line><line x1="396" y1="174" x2="420" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rt1126)"></line><rect x="580" y="78" width="150" height="48" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="655" y="100" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">gateway: US</text><text x="655" y="115" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">WebSocket subs</text><line x1="542" y1="174" x2="578" y2="102" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rt1126)"></line><rect x="580" y="150" width="150" height="48" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="655" y="172" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">gateway: EU</text><text x="655" y="187" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">WebSocket subs</text><line x1="542" y1="174" x2="578" y2="174" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rt1126)"></line><rect x="580" y="222" width="150" height="48" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="655" y="244" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">gateway: APAC</text><text x="655" y="259" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">WebSocket subs</text><line x1="542" y1="174" x2="578" y2="246" stroke="var(--cds-chart-axis)" stroke-width="1.5" marker-end="url(#rt1126)"></line><text x="482" y="232" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">one owner per channel</text><text x="24" y="296" font-size="11.5" fill="var(--cds-text-secondary)">Each gateway receives a channel's message once and fans it out to its own connected clients.</text><text x="24" y="316" font-size="11.5" fill="var(--cds-text-secondary)">Source: Slack Engineering, "Real-time Messaging" (April 2023).</text></svg>