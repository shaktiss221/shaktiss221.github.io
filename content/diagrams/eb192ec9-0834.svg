<svg viewBox="0 0 760 316" role="img" aria-label="Hot channels hit the database once, not once per request" font-size="13"><defs><marker id="ds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="var(--cds-text-primary)">Hot channels hit the database once, not once per request</text><text x="24" y="72" font-size="11.5" fill="var(--cds-text-secondary)">Three reads of channel 123 at once</text><g fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"><path d="M174 106L264 150" marker-end="url(#ds-arrow)"></path><path d="M174 182H264" marker-end="url(#ds-arrow)"></path><path d="M174 258L264 214" marker-end="url(#ds-arrow)"></path><path d="M504 182H568" marker-end="url(#ds-arrow)"></path></g><g><rect x="24" y="84" width="150" height="44" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="99" y="110" text-anchor="middle" fill="var(--cds-text-primary)">API server</text><rect x="24" y="160" width="150" height="44" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="99" y="186" text-anchor="middle" fill="var(--cds-text-primary)">API server</text><rect x="24" y="236" width="150" height="44" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="99" y="262" text-anchor="middle" fill="var(--cds-text-primary)">API server</text></g><g><rect x="264" y="120" width="240" height="124" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-1)" stroke-width="2"></rect><text x="384" y="146" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">Rust data service</text><text x="384" y="168" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">owns channel 123, chosen</text><text x="384" y="184" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">by consistent hash</text><text x="384" y="208" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">one in-flight query per key;</text><text x="384" y="224" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">later callers share its result</text></g><g><rect x="568" y="146" width="168" height="72" rx="8" fill="none" stroke="var(--cds-chart-axis)" stroke-width="1.25"></rect><text x="652" y="174" text-anchor="middle" font-weight="600" fill="var(--cds-text-primary)">ScyllaDB</text><text x="652" y="194" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">72 nodes</text></g><text x="536" y="174" text-anchor="middle" font-size="11.5" fill="var(--cds-text-secondary)">1 query</text><text x="24" y="300" font-size="11.5" fill="var(--cds-text-secondary)">Coalescing turns a burst of reads on a hot channel into a single database read.</text></svg>
