<svg viewBox="0 0 760 360" role="img" aria-label="A query plan tree where a row-count underestimate leads the planner to choose a nested loop join that runs far slower than expected" font-size="13"><defs><marker id="me1128" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--cds-chart-axis)"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="var(--cds-text-primary)">How one bad estimate picks the wrong join</text><text x="24" y="50" font-size="11.5" fill="var(--cds-text-secondary)">Illustrative plan: two correlated filters are assumed independent, so the planner expects 50 orders and gets 2,000.</text><rect x="250" y="72" width="260" height="56" rx="8" fill="var(--cds-chart-categorical-4)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-4)" stroke-width="1.25"></rect><text x="380" y="94" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">Nested Loop (chosen)</text><text x="380" y="112" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">est. 1,000 rows · actual 40,000 rows</text><line x1="330" y1="130" x2="180" y2="186" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#me1128)"></line><line x1="430" y1="130" x2="580" y2="186" stroke="var(--cds-chart-axis)" stroke-width="1.4" marker-end="url(#me1128)"></line><rect x="24" y="188" width="310" height="76" rx="8" fill="var(--cds-chart-categorical-1)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-1)" stroke-width="1.25"></rect><text x="179" y="209" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">Seq Scan on orders (outer)</text><text x="179" y="226" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--cds-text-secondary)">city = 'Paris' AND country = 'FR'</text><text x="179" y="244" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">est. 0.02 × 0.025 × 100k = 50 rows</text><text x="179" y="258" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">actual 2,000 rows (Paris implies FR)</text><rect x="426" y="188" width="310" height="76" rx="8" fill="var(--cds-chart-categorical-2)" fill-opacity="0.16" stroke="var(--cds-chart-categorical-2)" stroke-width="1.25"></rect><text x="581" y="209" text-anchor="middle" font-weight="600" font-size="12.5" fill="var(--cds-text-primary)">Index Scan on order_items (inner)</text><text x="581" y="226" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--cds-text-secondary)">order_id = orders.id</text><text x="581" y="244" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">planned: 50 probes</text><text x="581" y="258" text-anchor="middle" font-size="11" fill="var(--cds-text-secondary)">actual: 2,000 probes, random I/O each</text><rect x="24" y="284" width="712" height="34" rx="8" fill="var(--cds-chart-categorical-3)" fill-opacity="0.12" stroke="var(--cds-chart-categorical-3)" stroke-width="1.25"></rect><text x="380" y="306" text-anchor="middle" font-size="11.5" fill="var(--cds-text-primary)">With the true 2,000 outer rows, a Hash Join over one sequential pass of order_items would likely have been cheaper.</text><text x="24" y="342" font-size="11.5" fill="var(--cds-text-secondary)">The error is 40x at the first join and multiplies as more joins are stacked on top. Fix the estimate, not the plan.</text></svg>
